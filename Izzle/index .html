<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Jar for Babi 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars" id="stars"></div>

<div class="stage">
  <div class="eyebrow">Happy 7 Months</div>
  <h1>The Memory Jar</h1>
  <div class="sub">A jar full of little memories of us, Babi.<br>Shake it and pull one out.</div>
  <div class="count" id="countLabel"></div>

  <div class="jar-wrap" id="jarWrap" onclick="drawNote()">
    <svg class="jar" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
      <!-- lid -->
      <g class="jar-lid">
        <rect x="70" y="14" width="60" height="16" rx="4" fill="#e8b85c" opacity="0.9"/>
        <rect x="62" y="28" width="76" height="14" rx="6" fill="#e8b85c"/>
      </g>
      <!-- jar body -->
      <path d="M55 42 L145 42 L155 210 Q155 228 137 228 L63 228 Q45 228 45 210 Z"
            fill="rgba(244,198,212,0.10)" stroke="rgba(244,198,212,0.45)" stroke-width="2.5"/>
      <!-- candies & chocolates inside -->
      <g id="candyGroup" opacity="0.95">
        <!-- wrapped candy 1 (gold) -->
        <g transform="rotate(-10 82 158)">
          <ellipse cx="82" cy="158" rx="13" ry="9" fill="#e8b85c"/>
          <path d="M69 158 L60 151 L60 165 Z" fill="#e8b85c"/>
          <path d="M95 158 L104 151 L104 165 Z" fill="#e8b85c"/>
        </g>
        <!-- round chocolate 1 -->
        <circle cx="112" cy="168" r="11" fill="#7a4a2b"/>
        <ellipse cx="108" cy="164" rx="4" ry="2.5" fill="#c98a5e" opacity="0.7"/>
        <!-- wrapped candy 2 (berry) -->
        <g transform="rotate(8 90 185)">
          <ellipse cx="90" cy="185" rx="13" ry="9" fill="#c4425b"/>
          <path d="M77 185 L68 178 L68 192 Z" fill="#c4425b"/>
          <path d="M103 185 L112 178 L112 192 Z" fill="#c4425b"/>
        </g>
        <!-- round chocolate 2 -->
        <circle cx="70" cy="196" r="10" fill="#5c3420"/>
        <ellipse cx="66" cy="192" rx="3.5" ry="2" fill="#a86a45" opacity="0.7"/>
        <!-- wrapped candy 3 (blush) -->
        <g transform="rotate(-6 105 145)">
          <ellipse cx="105" cy="145" rx="12" ry="8" fill="#f4c6d4"/>
          <path d="M93 145 L85 139 L85 151 Z" fill="#f4c6d4"/>
          <path d="M117 145 L125 139 L125 151 Z" fill="#f4c6d4"/>
        </g>
        <!-- round chocolate 3 -->
        <circle cx="80" cy="210" r="9" fill="#7a4a2b"/>
      </g>
      <!-- shine -->
      <path d="M62 55 Q58 130 68 205" stroke="rgba(255,255,255,0.25)" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="jar-hint">Tap the jar to pull a memory</div>
  <div class="candy-dots" id="candyDots"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="note-card" id="noteCard"></div>
</div>

<div class="edit-note">to add photos or edit captions, open photos.js ✏️</div>

<script src="photos.js"></script>
<script src="script.js"></script>
</body>
</html>
